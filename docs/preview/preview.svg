  <text x="428" y="390" fill="#f0f0fa" font-family="system-ui,sans-serif" font-size="11">KJV</text>
  <rect x="472" y="372" width="48" height="28" rx="8" fill="rgba(240,240,250,0.06)" stroke="rgba(240,240,250,0.12)"/>
