  <text x="376" y="260" fill="#f0f0fa" font-family="system-ui,sans-serif" font-size="13" font-weight="700">Jeremiah 33:3</text>
  <rect x="500" y="244" width="46" height="22" rx="6" fill="rgba(232,184,97,0.2)" stroke="rgba(232,184,97,0.45)"/>
  <text x="510" y="259" fill="#e8b861" font-family="system-ui,sans-serif" font-size="10" font-weight="700" letter-spacing="1">WEB</text>
