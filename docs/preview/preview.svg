      <stop offset="0%" stop-color="#0a0a0c"/>
      <stop offset="100%" stop-color="#000"/>
    </linearGradient>
    <radialGradient id="glow" cx="72%" cy="18%" r="45%">
      <stop offset="0%" stop-color="#e8b861" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#e8b861" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#glow)"/>
  <!-- bar -->
  <rect x="0" y="0" width="800" height="40" fill="#0c0c0e" opacity="0.92"/>
  <text x="20" y="26" fill="#f0f0fa" font-family="system-ui,sans-serif" font-size="12" letter-spacing="3" opacity="0.85">OMARCHY</text>
  <rect x="680" y="8" width="100" height="24" rx="6" fill="rgba(240,240,250,0.08)"/>
  <text x="698" y="25" fill="#e8b861" font-family="system-ui,sans-serif" font-size="12">●</text>
  <text x="710" y="25" fill="#f0f0fa" font-family="system-ui,sans-serif" font-size="12">Jer 33:3</text>
